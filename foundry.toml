[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = false
fs_permissions = [
  { access = "read", path = "./vendor" },
  { access = "read-write", path = "./deployments" },
]
ffi = false
gas_reports = ["LaunchFactory", "FeeLocker", "LaunchToken"]

[rpc_endpoints]
arc_testnet = "${ARC_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
